name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install numpy pyyaml tqdm requests pytest
      - run: cmake -B build -DLITTLEBIT_SERVER=OFF -DPython3_EXECUTABLE="$(which python)"
      - run: cmake --build build -j 4
      - run: ctest --test-dir build --output-on-failure
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: ANDROID_NDK="$ANDROID_NDK_LATEST_HOME" scripts/build_android.sh
      - uses: actions/upload-artifact@v7
        with:
          name: android-arm64
          path: dist/
  shellcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck -x -P SCRIPTDIR scripts/*.sh tests/*.sh
